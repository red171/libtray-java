name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-2025
          - windows-11-arm
          - macos-15-intel
          - macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '25'
          cache: maven
      - name: Install Linux test bus
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y dbus libdbus-1-3
      - name: Start Windows shell
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Process explorer -ErrorAction SilentlyContinue)) {
            Start-Process explorer.exe
            Start-Sleep -Seconds 3
          }
          Write-Host "UserInteractive=$([Environment]::UserInteractive), SessionId=$((Get-Process -Id $PID).SessionId)"
          Get-Process explorer -ErrorAction SilentlyContinue | Select-Object Id, SessionId
      - name: Linux native tests
        if: runner.os == 'Linux'
        run: dbus-run-session -- mvn -B -Pnative-tests verify
      - name: Windows native tests
        if: runner.os == 'Windows'
        run: mvn -B -Pnative-tests verify
      - name: macOS tests and native smoke
        if: runner.os == 'macOS'
        run: |
          mvn -B verify
          java -XstartOnFirstThread --enable-native-access=ALL-UNNAMED \
            -cp target/classes:target/test-classes io.github.red171.libtray.macos.MacSmoke
      - name: Diagnose Windows shell failures
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class ShellProbe {
            [StructLayout(LayoutKind.Sequential, CharSet=CharSet.Unicode)]
            public struct IconData {
              public uint cbSize;
              public IntPtr hWnd;
              public uint uID, uFlags, uCallbackMessage;
              public IntPtr hIcon;
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst=128)] public string szTip;
              public uint dwState, dwStateMask;
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst=256)] public string szInfo;
              public uint uVersion;
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst=64)] public string szInfoTitle;
              public uint dwInfoFlags;
              public Guid guidItem;
              public IntPtr hBalloonIcon;
            }
            [DllImport("user32.dll", CharSet=CharSet.Unicode)]
            public static extern IntPtr CreateWindowExW(uint exStyle, string cls, string title, uint style,
              int x, int y, int width, int height, IntPtr parent, IntPtr menu, IntPtr instance, IntPtr param);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)]
            public static extern IntPtr LoadIconW(IntPtr instance, IntPtr name);
            [DllImport("user32.dll")] public static extern bool DestroyWindow(IntPtr window);
            [DllImport("shell32.dll", CharSet=CharSet.Unicode, SetLastError=true)]
            public static extern bool Shell_NotifyIconW(uint message, ref IconData data);
            public static void Run() {
              var window = CreateWindowExW(0, "STATIC", "Shell probe", 0, 0, 0, 0, 0,
                IntPtr.Zero, IntPtr.Zero, IntPtr.Zero, IntPtr.Zero);
              var data = new IconData {
                cbSize = (uint) Marshal.SizeOf<IconData>(), hWnd = window, uID = 177,
                uFlags = 0x87, uCallbackMessage = 0x401,
                hIcon = LoadIconW(IntPtr.Zero, new IntPtr(32512)), szTip = "Shell probe",
                szInfo = "", szInfoTitle = "", uVersion = 4
              };
              bool added = Shell_NotifyIconW(0, ref data);
              Console.WriteLine($"P/Invoke control: size={data.cbSize}, window={window}, icon={data.hIcon}, added={added}, error={Marshal.GetLastWin32Error()}");
              Shell_NotifyIconW(2, ref data);
              DestroyWindow(window);
            }
          }
          '@
          [ShellProbe]::Run()
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.runner }}
          path: target/surefire-reports

  publish:
    name: Publish Maven package
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '25'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Publish
        run: mvn -B -DskipTests deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify published package from an empty Maven cache
        run: >-
          mvn -B dependency:get
          -Dartifact=io.github.red171:libtray-java:0.1.0-SNAPSHOT
          -Dtransitive=false
          -DremoteRepositories=github::default::https://maven.pkg.github.com/red171/libtray-java
          -Dmaven.repo.local="${RUNNER_TEMP}/published-package-check"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7
        with:
          name: libtray-java
          path: |
            target/*.jar
            pom.xml
